name: Reader R2 verified source

on:
  push:
    branches: [audit/reader-stream-r2-20260922]
    paths: ['.audit-r2/**', '.github/workflows/reader-r2-apply.yml']

permissions:
  contents: read

concurrency:
  group: reader-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Djava.awt.headless=true -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/audit/reader-stream-r2-20260922
          mkdir -p test-results/audit-r2
          cat .audit-r2/reader.patch.xz.part{0,1,2,3,4,5} > /tmp/reader-r2.patch.xz
          echo 'dc6760cf2fc1a6845b41474c4b17b22e1819db82a640cf97e626189ff596f6d4  /tmp/reader-r2.patch.xz' | sha256sum --check
          xz -dc /tmp/reader-r2.patch.xz > /tmp/reader-r2.patch
          echo '0d8b27e033fd92853ef8eeadef582b18382ae1dc44144bd42fc06283bd44589f  /tmp/reader-r2.patch' | sha256sum --check
          git apply --unidiff-zero --check /tmp/reader-r2.patch
          git apply --unidiff-zero /tmp/reader-r2.patch
          git add .gitignore README.md docs src scripts
          git diff --cached --check
          git rev-parse HEAD > test-results/audit-r2/base-sha.txt
          git write-tree > test-results/audit-r2/tested-tree.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Credential audit (redacted; tracked source and reachable history)
        run: python3 scripts/security/scan_secrets.py --history --out test-results/audit-r2/secrets.json
      - name: Offline regression scripts
        shell: bash
        run: |
          bash -n run.sh scripts/verification/run_reader_browser.sh
          for file in src/main/resources/static/*.js src/main/resources/export/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
          node scripts/verification/probe_page_progress.mjs
          python3 -m pip install --disable-pip-version-check OpenCC==1.4.2
          python3 -m py_compile scripts/verification/*.py scripts/security/*.py
          python3 scripts/verification/shadow_eval.py --selftest
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
      - name: Full Java verification
        run: mvn --batch-mode -DargLine="-Djava.awt.headless=true -Dfile.encoding=UTF-8" verify
      - name: Browser regression using generated fixtures (no cloud calls)
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install --with-deps chromium; fi
          bash scripts/verification/run_reader_browser.sh
      - name: Publish tested source to this isolated branch only
        if: success()
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/audit/reader-stream-r2-20260922
          test "$(git ls-remote origin refs/heads/audit/reader-stream-r2-20260922 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: current-page streaming, source-grounded review and secure progress'
          git rev-parse HEAD > test-results/audit-r2/published-sha.txt
          git push origin HEAD:refs/heads/audit/reader-stream-r2-20260922
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-r2-evidence-${{ github.sha }}
          path: |
            target/surefire-reports/
            test-results/
          retention-days: 7
