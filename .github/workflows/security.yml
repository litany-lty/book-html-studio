name: Redacted secret guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files (redacted locations only)
        run: python3 scripts/verification/scan_secrets.py --report test-results/security/tracked.json
      - name: Scan reachable history (redacted locations only)
        if: always()
        run: python3 scripts/verification/scan_secrets.py --history --report test-results/security/history.json
      - name: Record exact scope
        if: always()
        run: |
          mkdir -p test-results/security
          git rev-parse HEAD > test-results/security/tested-sha.txt
          git rev-list --all --count > test-results/security/reachable-commit-count.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redacted-secret-report-${{ github.sha }}
          path: test-results/security/
          retention-days: 7
