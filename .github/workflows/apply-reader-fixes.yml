name: Apply and verify reviewed reader fixes
on:
  push:
    branches: [audit/reader-priority-context-progress-20260922]
    paths: [.github/workflows/apply-reader-fixes.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'litany-lty/book-html-studio' && github.ref == 'refs/heads/audit/reader-priority-context-progress-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply reviewed text changes with base and result integrity checks
        id: apply
        env:
          TARGET: audit/reader-priority-context-progress-20260922
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '239ef4a675474ec2eb5753453d42ccffb92cbb5b'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          payload = b''.join((root / f'audit/reader-delta-{i}.part').read_bytes() for i in range(4))
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(payload, max_length=2*1024*1024)
          if not decoder.eof or decoder.unused_data or len(raw) > 2*1024*1024:
              raise RuntimeError('Invalid bounded archive')
          if hashlib.sha256(raw).hexdigest() != 'b47b3726b031ad3b69d1ec4daad248b6547e8c5da1df022cddab56dff922d7da':
              raise RuntimeError('Reviewed delta digest mismatch')
          delta = json.loads(raw)
          if delta.get('format') != 1 or len(delta.get('files', [])) != 45:
              raise RuntimeError('Unexpected delta format')
          pending, seen = [], set()
          for item in delta['files']:
              name = item['path']; path = PurePosixPath(name); target = root / name
              if path.is_absolute() or '..' in path.parts or str(path) != name or name in seen:
                  raise RuntimeError('Unsafe path')
              if not (name.startswith(('src/', 'scripts/verification/', 'docs/verification/')) or name in ('.gitignore', '.github/workflows/reader-quality.yml')):
                  raise RuntimeError('Unreviewed path')
              if target.is_symlink() or any(p.is_symlink() for p in target.parents) or not target.resolve().is_relative_to(root):
                  raise RuntimeError('Symbolic path')
              seen.add(name)
              before = target.read_bytes() if target.exists() else None
              digest = hashlib.sha256(before).hexdigest() if before is not None else None
              if name == '.github/workflows/reader-quality.yml':
                  if digest != item['after']: raise RuntimeError('Pre-staged verification workflow mismatch')
                  continue
              if digest != item['before']: raise RuntimeError('Base mismatch: ' + name)
              text = (before or b'').decode('utf-8'); end = 0
              for pos, length, addition in item['ops']:
                  if not isinstance(pos, int) or not isinstance(length, int) or not isinstance(addition, str) or pos < end or length < 0 or pos + length > len(text):
                      raise RuntimeError('Invalid splice')
                  end = pos + length
              for pos, length, addition in reversed(item['ops']):
                  text = text[:pos] + addition + text[pos + length:]
              result = text.encode('utf-8')
              if hashlib.sha256(result).hexdigest() != item['after']: raise RuntimeError('Result mismatch: ' + name)
              pending.append((target, result))
          for target, result in pending:
              target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          print('Verified 45 source/test/workflow file hashes. No existing workflow modified by this job.')
          PY
          git rm -- audit/reader-delta-{0,1,2,3}.part
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reader): prioritize current pages, ground OCR context, report progress and protect secrets'
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record tested revision
        run: |
          mkdir -p test-results/reader-audit
          git rev-parse HEAD > test-results/reader-audit/tested-sha.txt
      - name: Redacted tracked-file and reachable-history security scan
        run: python3 scripts/verification/scan_secrets.py --history --output test-results/reader-audit/secrets.json
      - name: Syntax and streaming regressions
        if: always()
        run: |
          bash -n run.sh
          for f in src/main/resources/static/*.js src/main/resources/export/*.js scripts/*.mjs; do node --check "$f"; done
          node scripts/verification/probe_reader_stream.mjs
          node scripts/verification/probe_reading_window.js
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
      - name: Python regressions
        if: always()
        run: |
          python3 -m pip install --disable-pip-version-check OpenCC==1.4.2
          python3 -m py_compile scripts/verification/*.py
          python3 scripts/verification/shadow_eval.py --selftest
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
      - name: Java 17 test and package
        if: always()
        run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-verified-${{ needs.apply.outputs.sha }}
          path: |
            target/surefire-reports/
            test-results/
          retention-days: 7
