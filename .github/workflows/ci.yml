name: CI

on:
  push:
    branches: [main, jev-m1, integrate/reader-20260922]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested SHA
        run: |
          echo "testedCommit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "checkoutSHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --porcelain
      - name: Record review source manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          out = root / 'test-results'
          out.mkdir(exist_ok=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          text_extensions = {'.java', '.js', '.mjs', '.py', '.sh', '.properties', '.xml', '.json', '.html', '.css', '.md', '.yml', '.yaml', '.txt'}
          entries = []
          with zipfile.ZipFile(out / 'review-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(filter(None, paths)):
                  path = root / name
                  if path.is_symlink() or not path.is_file():
                      entries.append({'path': name, 'review': 'NOT_READ', 'snapshot': 'EXCLUDED_NON_REGULAR'})
                      continue
                  data = path.read_bytes()
                  include = path.suffix in text_extensions and not path.name.startswith('.env')
                  entries.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data), 'review': 'NOT_READ', 'snapshot': 'INCLUDED' if include else 'EXCLUDED_BINARY_OR_PRIVATE_CONFIG'})
                  if include:
                      archive.writestr(name, data)
              archive.writestr('REVIEW-SNAPSHOT-SHA.txt', sha + '\n')
          (out / 'source-manifest.json').write_text(json.dumps({'schemaVersion': 1, 'testedCommit': sha, 'note': 'Inventory only; NOT_READ does not claim an audit or a passing secret scan.', 'files': entries}, ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check scripts
        shell: bash
        run: |
          bash -n run.sh
          for file in src/main/resources/static/*.js src/main/resources/export/*.js scripts/*.mjs; do
            node --check "$file"
          done
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
          node scripts/verification/probe_api_lifecycle.mjs
          node --test scripts/verification/probe_reader_cache.mjs scripts/verification/probe_ready_window_bounds.mjs scripts/verification/probe_reader_api.mjs
          node scripts/verification/probe_page_progress.mjs
          node --test scripts/verification/probe_final_gaps.mjs scripts/verification/probe_auto_reading_policy.mjs
          node scripts/verification/probe_settings_secrets.mjs
          node --test scripts/verification/probe_job_summary.mjs scripts/verification/probe_lan_bookshelf.mjs
          node --test scripts/verification/probe_reader_restore_scope.mjs scripts/verification/probe_reader_mode.mjs
      - name: Python verification tests
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check OpenCC==1.4.2
          python3 -m py_compile scripts/verification/*.py
          python3 scripts/verification/shadow_eval.py --selftest
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
      - name: Redacted credential scan
        run: python3 scripts/security/scan_secrets.py --history --out test-results/secret-scan.json
      - name: Test and package
        run: mvn --batch-mode verify
      - name: Repeat lifecycle regression gates
        shell: bash
        run: |
          mkdir -p test-results/full-suite
          cp target/surefire-reports/TEST-*.xml test-results/full-suite/
          for round in 1 2 3; do
            mvn --batch-mode -Dtest=FinalGapRegressionTest,PriorityTaskSchedulerTest,QwenAssistCoordinatorTest,ReadingWindowServiceTest,PageAttemptLifecycleTest,RemediationLifecycleTest,ProgressReducerRegressionTest,QwenRequestGateTest,DurableReprocessTest,PageStatisticsCacheTest,PagePublicationAuthorityTest,PublicationProcessCrashTest,UnifiedPageEngineTest,QwenPhysicalCallTest,QwenLedgerIntegrationTest test
            mkdir -p "test-results/lifecycle-repeat-$round"
            for suite in FinalGapRegressionTest PriorityTaskSchedulerTest QwenAssistCoordinatorTest ReadingWindowServiceTest PageAttemptLifecycleTest RemediationLifecycleTest ProgressReducerRegressionTest QwenRequestGateTest DurableReprocessTest PageStatisticsCacheTest PagePublicationAuthorityTest PublicationProcessCrashTest UnifiedPageEngineTest QwenPhysicalCallTest QwenLedgerIntegrationTest; do
              cp "target/surefire-reports/TEST-studio.bookhtml.service.$suite.xml" "test-results/lifecycle-repeat-$round/"
            done
            mvn --batch-mode -Dtest=IndexReadIntegrityTest,SourcePublicationIntegrityTest,SourceCheckpointTest,ComprehensibilityResumeTest,ComprehensibilityResumeStoreTest,AutomaticComprehensibilityTest,HandwritingTranscribeServiceTest,ManuscriptResumeTest,ManuscriptResumeStoreTest,PageWorkSchedulerOwnershipTest,RemoteJobStaleReclaimTest test
            cp target/surefire-reports/TEST-studio.bookhtml.service.IndexReadIntegrityTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.store.SourcePublicationIntegrityTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.store.SourceCheckpointTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.service.ComprehensibilityResumeTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.service.ComprehensibilityResumeStoreTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.service.ManuscriptResumeTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.service.ManuscriptResumeStoreTest.xml "test-results/lifecycle-repeat-$round/"
            mvn --batch-mode -Dtest=CurrentAuditReproductionTest,ConsentAuthorityRegressionTest,RemoteRecoveryQuarantineTest,ProgressPlanAuthorityTest,EvidenceAndCompletionTest,PhysicalBoundaryRegressionTest,LegacyModelBoundaryTest test
            for suite in AutomaticComprehensibilityTest HandwritingTranscribeServiceTest PageWorkSchedulerOwnershipTest RemoteJobStaleReclaimTest CurrentAuditReproductionTest ConsentAuthorityRegressionTest RemoteRecoveryQuarantineTest ProgressPlanAuthorityTest EvidenceAndCompletionTest PhysicalBoundaryRegressionTest LegacyModelBoundaryTest; do
              cp "target/surefire-reports/TEST-studio.bookhtml.service.$suite.xml" "test-results/lifecycle-repeat-$round/"
            done
            mvn --batch-mode -Dtest=JevBoundaryRegressionTest,JevClientTest,CoordinatorTest,AcceptTest test
            for suite in JevBoundaryRegressionTest JevClientTest CoordinatorTest AcceptTest; do
              cp "target/surefire-reports/TEST-studio.bookhtml.decision.$suite.xml" "test-results/lifecycle-repeat-$round/"
            done
            mvn --batch-mode -Dtest=LanReaderAccessTest,SharedLanDefaultsTest,UploadedLibraryPersistenceTest test
            cp target/surefire-reports/TEST-studio.bookhtml.config.SharedLanDefaultsTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.config.LanReaderAccessTest.xml "test-results/lifecycle-repeat-$round/"
            cp target/surefire-reports/TEST-studio.bookhtml.service.UploadedLibraryPersistenceTest.xml "test-results/lifecycle-repeat-$round/"
          done
      - name: Build manifest
        run: |
          python3 scripts/verification/build_manifest.py --jar target/book-html-studio.jar --out test-results/build
          echo "testedCommit=${testedCommit}" > test-results/sha.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jev-test-evidence-${{ github.sha }}
          path: |
            target/surefire-reports/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Untested items (explicit NOT_RUN/BLOCKED, not simulated)
        if: always()
        run: |
          echo "NOT_RUN: online real-browser CDP (needs GUI/displays, see scripts/verification/cdp_*.py)"
          echo "NOT_RUN: file:// offline IDB restore/backup-import (needs real browser profile)"
          echo "NOT_RUN: SHADOW_LIVE real-model runs (needs SHADOW_LIVE=1 + dataset + TYPESAFE_API_KEY)"
          echo "BLOCKED: none (Ubuntu unit CI); platform-specific faults recorded per-run, not closed by this CI"
