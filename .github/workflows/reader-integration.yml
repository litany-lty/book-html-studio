name: Reader integration staging

on:
  push:
    branches: [integrate/reader-20260922]

permissions:
  contents: read

concurrency:
  group: reader-integration-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce exact reviewed integration tree
        run: python3 .integration/apply.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and offline guards
        run: |
          mvn --batch-mode verify
          bash -n run.sh
          for file in src/main/resources/static/*.js src/main/resources/export/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
          node scripts/verification/probe_api_lifecycle.mjs
          node scripts/verification/probe_page_progress.mjs
          node scripts/verification/probe_settings_secrets.mjs
          node --test scripts/verification/probe_scan_empty.mjs scripts/verification/probe_focus_reading.mjs
          python3 -m pip install --disable-pip-version-check OpenCC==1.4.2
          python3 scripts/verification/shadow_eval.py --selftest
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
          python3 scripts/security/scan_secrets.py --history --out test-results/integration/secret-scan.json
      - name: Browser prerequisites
        id: browser
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.51.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if ! command -v chromium && ! command -v google-chrome; then python3 -m playwright install --with-deps chromium; fi
      - name: Actual focus UI and guarded scan fallbacks (synthetic API)
        run: |
          status=0
          python3 scripts/verification/browser_focus_reading.py || status=1
          python3 scripts/verification/browser_scan_recovery.py || status=1
          exit "$status"
      - name: Real server reader and settings smoke (OCR stub, no cloud)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: bash scripts/verification/run_reader_browser.sh
      - name: Record exact tested tree
        if: always()
        run: |
          mkdir -p test-results/integration
          git write-tree > test-results/integration/tested-tree.txt
          git rev-parse HEAD > test-results/integration/staging-sha.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-integration-staging-${{ github.sha }}
          path: |
            test-results/
            target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: verify
    if: github.repository == 'litany-lty/book-html-studio' && github.ref == 'refs/heads/integrate/reader-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Publish only the exact verified source tree on the integration branch
        run: |
          python3 .integration/apply.py
          test "$(git write-tree)" = '18e7ac2648107d0b4d8338f1ede19e6678090334'
          branch='refs/heads/integrate/reader-20260922'
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(reader): integrate safe lifecycle, encrypted secrets, focus gestures and scan recovery'
          git push origin "HEAD:$branch"
          echo "Published exact tested source: $(git rev-parse HEAD)"
