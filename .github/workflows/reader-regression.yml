name: Reader regression

on:
  push:
    branches: [audit/reader-stream-verified-7aae566-20260922]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reader-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record exact tested checkout
        run: |
          mkdir -p test-results/audit
          git rev-parse HEAD > test-results/audit/tested-sha.txt
          git diff --exit-code
      - name: Redacted credential guard
        run: |
          python3 scripts/security/scan_secrets.py --out test-results/audit/secrets-worktree.json
          python3 scripts/security/scan_secrets.py --history --out test-results/audit/secrets-history.json
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Reader script regressions
        run: |
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
          node scripts/verification/probe_reading_window.js
          node scripts/verification/probe_page_progress.js
          python3 -m py_compile scripts/verification/browser_reader_audit.py
      - name: Browser environment with Chinese UI fonts
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.51.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if ! command -v chromium && ! command -v google-chrome; then python3 -m playwright install --with-deps chromium; fi
      - name: Synthetic reader browser regression
        run: python3 scripts/verification/browser_reader_audit.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
