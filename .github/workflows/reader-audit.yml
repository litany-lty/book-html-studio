name: Reader audit verification

on:
  push:
    branches: [audit/reader-stream-context-security-20260922]

permissions:
  contents: read

concurrency:
  group: reader-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Baseline Java regression
        run: mvn --batch-mode verify
      - name: Collect offline tooling (no settings or credentials)
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil, zipfile
          out = pathlib.Path('audit-evidence')
          out.mkdir(exist_ok=True)
          home = pathlib.Path(shutil.which('mvn')).resolve().parent.parent
          repo = pathlib.Path.home() / '.m2' / 'repository'
          with zipfile.ZipFile(out / 'offline-tooling.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in ('bin', 'boot', 'lib', 'conf'):
                  for p in (home / name).rglob('*'):
                      if p.is_file() and p.name not in ('settings.xml', 'toolchains.xml'):
                          z.write(p, 'maven/' + str(p.relative_to(home)))
              for p in repo.rglob('*'):
                  if p.is_file() and (p.suffix in ('.jar', '.pom', '.sha1') or p.name == '_remote.repositories'):
                      z.write(p, 'm2/' + str(p.relative_to(repo)))
          (out / 'tested-sha.txt').write_text(os.environ['GITHUB_SHA'])
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-audit-offline-tooling-${{ github.sha }}
          path: audit-evidence/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-audit-tests-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 7
