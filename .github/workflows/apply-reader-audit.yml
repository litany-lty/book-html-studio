name: Verify and apply reviewed reader fixes

on:
  push:
    branches: [audit/reader-stream-context-security-20260922]
    paths: [.github/workflows/apply-reader-audit.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'litany-lty/book-html-studio' && github.ref == 'refs/heads/audit/reader-stream-context-security-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested_tree: ${{ steps.tree.outputs.tested_tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed patch with preimage verification
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.audit-transfer/part{i}.b64').read_text().strip() for i in range(1, 5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '2a34d4cabc74c3b48bb1797068ef5b2605976cb67e1b959dd83365929a44b78d'
          patch = lzma.decompress(compressed)
          assert len(patch) == 144057
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reader-audit.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero "$RUNNER_TEMP/reader-audit.patch"
          echo '0855c74c2f61720449cb79b8f8cdc3bcfd63f076455576bd83d532a7ecd99cab  .audit-transfer/scanner-amendment.patch' | sha256sum --check --status
          git apply --index .audit-transfer/scanner-amendment.patch
          echo 'd8a052c474354990a2444391e60b999317b74fb62f286b0b7e4a53c91c7835b9  .audit-transfer/concurrency-test-amendment.patch' | sha256sum --check --status
          git apply --index .audit-transfer/concurrency-test-amendment.patch
          git diff --cached --check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and frontend regression
        shell: bash
        run: |
          bash -n run.sh
          for file in src/main/resources/static/*.js src/main/resources/export/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/verification/probe_display.js
          node scripts/verification/probe_job_scope.js
          node --test scripts/verification/reader_stream_audit.test.mjs
      - name: Credential guard including all fetched reachable history
        run: |
          python3 scripts/verification/secret_scan.py --self-test
          python3 scripts/verification/secret_scan.py --history
      - name: Python regression
        run: |
          python3 -m pip install --disable-pip-version-check OpenCC==1.4.2
          python3 -m py_compile scripts/verification/*.py
          python3 scripts/verification/shadow_eval.py --selftest
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
      - name: Java regression and package
        run: mvn --batch-mode verify
      - name: Record tested tree
        id: tree
        run: |
          echo "tested_tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          mkdir -p test-results/reader-audit
          git write-tree > test-results/reader-audit/tested-tree.txt
          printf '%s\n' "${GITHUB_SHA}" > test-results/reader-audit/base-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-reviewed-fix-tests-${{ github.sha }}
          path: |
            target/surefire-reports/
            test-results/
          retention-days: 7
  publish:
    needs: verify
    if: github.repository == 'litany-lty/book-html-studio' && github.ref == 'refs/heads/audit/reader-stream-context-security-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Reproduce only the verified tree and fast-forward the audit branch
        shell: bash
        env:
          TESTED_TREE: ${{ needs.verify.outputs.tested_tree }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.audit-transfer/part{i}.b64').read_text().strip() for i in range(1, 5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '2a34d4cabc74c3b48bb1797068ef5b2605976cb67e1b959dd83365929a44b78d'
          patch = lzma.decompress(compressed)
          assert len(patch) == 144057
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reader-audit.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero "$RUNNER_TEMP/reader-audit.patch"
          echo '0855c74c2f61720449cb79b8f8cdc3bcfd63f076455576bd83d532a7ecd99cab  .audit-transfer/scanner-amendment.patch' | sha256sum --check --status
          git apply --index .audit-transfer/scanner-amendment.patch
          echo 'd8a052c474354990a2444391e60b999317b74fb62f286b0b7e4a53c91c7835b9  .audit-transfer/concurrency-test-amendment.patch' | sha256sum --check --status
          git apply --index .audit-transfer/concurrency-test-amendment.patch
          git diff --cached --check
          test "$(git write-tree)" = "$TESTED_TREE"
          target='refs/heads/audit/reader-stream-context-security-20260922'
          test "$(git ls-remote origin "$target" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(reader): current-page streaming, evidence-bound context, truthful progress and secret boundaries'
          git push origin "HEAD:$target"
          echo "Published reviewed commit: $(git rev-parse HEAD)"
