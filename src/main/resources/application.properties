server.address=${BIND:127.0.0.1}
server.port=${PORT:18765}
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_MB:300}MB
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD_MB:300}MB
server.error.include-message=never
app.data-dir=${BOOK_DATA_DIR:./data}
app.max-upload-mb=${APP_MAX_UPLOAD_MB:300}
app.max-pages=${APP_MAX_PAGES:5000}
app.max-image-width=${APP_MAX_IMAGE_WIDTH:2400}
app.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.dashscope-api-key=${DASHSCOPE_API_KEY:}
app.qwen-model=${QWEN_MODEL:qwen3.5-ocr}
app.qwen-base-url=${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
app.qwen-timeout-seconds=${QWEN_TIMEOUT_SECONDS:60}
app.minimax-api-key=${MINIMAX_API_KEY:}
app.minimax-model=${MINIMAX_MODEL:MiniMax-M3}
app.minimax-base-url=${MINIMAX_BASE_URL:https://api.minimax.cn/v1}
app.minimax-timeout-seconds=${MINIMAX_TIMEOUT_SECONDS:60}
app.minimax-assist-enabled=${MINIMAX_ASSIST_ENABLED:false}
app.baidu-ocr-api-key=${BAIDU_OCR_API_KEY:}
app.baidu-ocr-secret-key=${BAIDU_OCR_SECRET_KEY:}
app.paddle-model=${PADDLE_OCR_MODEL:PaddleOCR-VL-1.6}
app.paddle-job-url=${PADDLE_OCR_JOB_URL:https://aip.baidubce.com/rest/2.0/brain/online/v2/paddle-vl-parser/task}
app.paddle-request-timeout-seconds=${PADDLE_OCR_REQUEST_TIMEOUT_SECONDS:60}
app.paddle-total-timeout-seconds=${PADDLE_OCR_TOTAL_TIMEOUT_SECONDS:180}
app.paddle-poll-interval-seconds=${PADDLE_OCR_POLL_INTERVAL_SECONDS:5}
app.paddle-aistudio.access-token=${PADDLEOCR_ACCESS_TOKEN:}
app.paddle-aistudio.job-url=${PADDLE_AISTUDIO_JOB_URL:https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
app.paddle-aistudio.model=${PADDLE_AISTUDIO_MODEL:PaddleOCR-VL-1.6}
app.paddle-aistudio.request-timeout-seconds=${PADDLE_AISTUDIO_REQUEST_TIMEOUT_SECONDS:60}
app.paddle-aistudio.total-timeout-seconds=${PADDLE_AISTUDIO_TOTAL_TIMEOUT_SECONDS:180}
app.paddle-aistudio.poll-interval-seconds=${PADDLE_AISTUDIO_POLL_INTERVAL_SECONDS:5}
app.ppocr.url=${PPOCR_URL:https://aip.baidubce.com/rest/2.0/ocr/v1/pp_ocrv5}
app.ppocr.request-timeout-seconds=${PPOCR_REQUEST_TIMEOUT_SECONDS:60}
app.qwen-assist.api-key=${DASHSCOPE_API_KEY:}
app.qwen-assist.base-url=${QWEN_ASSIST_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.qwen-assist.model=${QWEN_ASSIST_MODEL:qwen3.8-max}
app.qwen-assist.timeout-seconds=${QWEN_ASSIST_TIMEOUT_SECONDS:120}
app.qwen-assist.enabled=${QWEN_ASSIST_ENABLED:true}

# Optional explicit LAN hostnames; IP access uses the actual destination interface.
app.allowed-hosts=${BOOK_ALLOWED_HOSTS:}
# Same-provider regional recovery only after a user-initiated OCR misses possible text.
# Disable extra regional calls without weakening the nonblank/empty-result guard.
app.ocr-region-recovery=${OCR_REGION_RECOVERY:true}
